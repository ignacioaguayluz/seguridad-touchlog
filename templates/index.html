<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TouchLog — Bitácora Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 2L4 7v7c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V7L14 2z" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
            <path d="M10 14l3 3 5-5" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-main">TouchLog</span>
          <span class="logo-sub">Bitácora Digital</span>
        </div>
      </div>
      <div class="header-meta">
        <span id="live-clock">--:--:--</span>
        <span id="live-date">--/--/----</span>
      </div>
    </div>
  </header>

  <main>

    <!-- FORM CARD -->
    <section class="form-section">
      <div class="card form-card">
        <div class="card-label">NUEVA VISITA</div>
        <h2 class="card-title">Registrar Ingreso</h2>

        <div class="form-grid">
          <div class="field">
            <label for="nombre">Nombre del visitante</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" autocomplete="off" />
          </div>
          <div class="field">
            <label for="motivo">Motivo de visita</label>
            <input type="text" id="motivo" placeholder="Ej. Reunión, entrega, mantenimiento…" autocomplete="off" />
          </div>
          <div class="field full">
            <label for="comentario">Comentario <span class="optional">(opcional)</span></label>
            <textarea id="comentario" rows="3" placeholder="Observaciones adicionales…"></textarea>
          </div>
        </div>

        <button class="btn-register" id="btn-register" onclick="registrarVisita()">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6 9l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="btn-label">Registrar visita</span>
        </button>

        <!-- Scan effect overlay -->
        <div class="scan-overlay" id="scan-overlay">
          <div class="scan-content">
            <div class="scan-ring"></div>
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <path d="M15 20l6 6 10-10" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p>Visita registrada</p>
          </div>
        </div>
      </div>
    </section>

    <!-- REGISTROS -->
    <section class="records-section">
      <div class="records-header">
        <h3>Bitácora de visitas</h3>
        <span class="badge" id="total-badge">0 registros</span>
      </div>

      <div id="empty-state" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="8" y="6" width="32" height="36" rx="3" stroke="#444" stroke-width="1.5"/>
          <line x1="15" y1="16" x2="33" y2="16" stroke="#444" stroke-width="1.5"/>
          <line x1="15" y1="22" x2="33" y2="22" stroke="#444" stroke-width="1.5"/>
          <line x1="15" y1="28" x2="25" y2="28" stroke="#444" stroke-width="1.5"/>
        </svg>
        <p>Sin visitas registradas aún</p>
      </div>

      <div id="visitas-list" class="visitas-list"></div>
    </section>

  </main>

  <footer>
    <span>TouchLog · 3D Factory CR</span>
    <span id="footer-count">—</span>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
